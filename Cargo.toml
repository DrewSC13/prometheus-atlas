[workspace]
members = [
    "apps/scanner",
    "apps/worker",
    "apps/scheduler",
    "crates/atlas-api",
    "crates/atlas-config",
    "crates/atlas-core",
    "crates/atlas-correlation",
    "crates/atlas-diff",
    "crates/atlas-discovery",
    "crates/atlas-dns",
    "crates/atlas-drift",
    "crates/atlas-episodes",
    "crates/atlas-graph",
    "crates/atlas-http",
    "crates/atlas-jobs",
    "crates/atlas-output",
    "crates/atlas-plugins",
    "crates/atlas-query",
    "crates/atlas-report",
    "crates/atlas-risk",
    "crates/atlas-scheduler",
    "crates/atlas-snapshot",
    "crates/atlas-store",
    "crates/atlas-tenancy",
    "crates/atlas-queue",
]
resolver = "2"

[workspace.package]
version = "0.30.0"
edition = "2021"
license = "MIT"
authors = ["Prometheus Atlas Contributors"]
repository = "https://github.com/DrewSC13/prometheus-atlas"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros", "json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1"
jsonwebtoken = "10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"