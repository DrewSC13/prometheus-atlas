[package]
name = "atlas-store"
version = "0.30.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

atlas-core = { path = "../atlas-core" }
atlas-drift = { path = "../atlas-drift" }
atlas-episodes = { path = "../atlas-episodes" }
atlas-graph = { path = "../atlas-graph" }
atlas-jobs = { path = "../atlas-jobs" }
atlas-queue = { path = "../atlas-queue" }
atlas-snapshot = { path = "../atlas-snapshot" }
atlas-tenancy = { path = "../atlas-tenancy" }