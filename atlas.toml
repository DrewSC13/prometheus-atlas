[storage]
path = ".atlas/atlas.db"

[logging]
level = "info"
json = false

[telemetry]
enabled = true

[drift]
persist_by_default = true
profile = "standard"

[plugins]
enabled = []

[jobs]
default_interval_seconds = 3600

[[profiles]]
name = "standard"
ports = [80, 443]
timeout_ms = 3000

[[profiles]]
name = "deep"
ports = [80, 443, 8080, 8443]
timeout_ms = 5000